name: Build and Push Docker Image

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-push:
    name: Build & Push Container
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} #No slip-ups here

      - name: Build Image
        run: |
          IMAGE_NAME=ghcr.io/openfighting-game
          docker build -t $IMAGE_NAME:latest .

      - name: Tag Image with SHA
        run: |
          IMAGE_NAME=ghcr.io/openfighting-game
          SHA_TAG=$(echo ${{ github.sha }} | cut -c1-7)
          docker tag $IMAGE_NAME:latest $IMAGE_NAME:$SHA_TAG
          echo "IMAGE_SHA_TAG=$SHA_TAG" >> $GITHUB_ENV

      - name: Push Image
        run: |
          IMAGE_NAME=ghcr.io/openfighting-game
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ env.IMAGE_SHA_TAG }}
